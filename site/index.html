<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cinco Somewhere</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="sparkle">&#10022;</div>
      <div class="date-nav">
        <button class="date-arrow today-jump hidden" id="jump-prev" aria-label="Jump to today">&#171;</button>
        <button class="date-arrow" id="prev-day" aria-label="Previous day">&#8249;</button>
        <h1 class="date-display"></h1>
        <button class="date-arrow" id="next-day" aria-label="Next day">&#8250;</button>
        <button class="date-arrow today-jump hidden" id="jump-next" aria-label="Jump to today">&#187;</button>
      </div>
      <p class="location-badge"></p>
    </header>

    <div class="cards-container" id="cards">
      <div class="card" data-card="0">
        <span class="card-number">01</span>
        <h2 class="card-title">What are we celebrating?</h2>
        <div class="card-divider"></div>
        <p class="card-body" id="card-celebrating"></p>
      </div>

      <div class="card" data-card="1">
        <span class="card-number">02</span>
        <h2 class="card-title">What are we drinking?</h2>
        <div class="card-divider"></div>
        <p class="card-body" id="card-drinking"></p>
      </div>

      <div class="card" data-card="2">
        <span class="card-number">03</span>
        <h2 class="card-title">What else should we know?</h2>
        <div class="card-divider"></div>
        <p class="card-body" id="card-how"></p>
      </div>

    </div>

    <div class="dots" id="dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="toast-banner" id="toast-banner">
      <span class="toast-text"></span>
    </div>

    <footer class="site-footer">
      <span>&#10022;</span>
      <em>Because it's Cinco de Mayo somewhere, probably.</em>
      <span>&#10022;</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
